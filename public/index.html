<!doctype html>
<html lang="pt-BR" class="dark">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="color-scheme" content="dark light">
  <title>Observa · Radar Ódio</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Manrope:wght@400;500;600;700;800&display=swap" rel="stylesheet">
  <script src="https://cdn.tailwindcss.com"></script>
  <script>tailwind.config={darkMode:'class',theme:{extend:{fontFamily:{sans:['Manrope','sans-serif']},colors:{ink:{950:'#080d16',900:'#0d1421'},mint:{400:'#2dd4bf',500:'#14b8a6'}}}}}</script>
  <script src="/vendor/papaparse.min.js"></script>
  <link rel="stylesheet" href="/css/app.css">
</head>
<body class="min-h-screen bg-slate-50 text-slate-900 antialiased dark:bg-ink-950 dark:text-slate-100">
  <div id="loading" class="fixed inset-0 z-[100] grid place-items-center bg-ink-950">
    <div class="text-center">
      <div class="loader mx-auto mb-5"></div>
      <p class="text-sm font-semibold tracking-wide text-slate-400">Preparando o espaço de avaliação</p>
    </div>
  </div>

  <div id="login-root" class="hidden min-h-screen"></div>

  <div id="app-shell" class="hidden min-h-screen lg:grid lg:grid-cols-[264px_1fr]">
    <aside id="sidebar" class="fixed inset-y-0 left-0 z-50 flex w-[264px] -translate-x-full flex-col border-r border-white/10 bg-ink-900 px-4 py-5 transition-transform lg:translate-x-0">
      <div class="flex items-center gap-3 px-2">
        <div class="grid h-11 w-11 place-items-center rounded-2xl bg-mint-400 text-ink-950 shadow-lg shadow-teal-500/20">
          <svg aria-hidden="true" class="h-6 w-6" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><path d="M12 3 4 7v5c0 5 3.4 8 8 9 4.6-1 8-4 8-9V7l-8-4Z"/><path d="m9 12 2 2 4-4"/></svg>
        </div>
        <div><p class="text-lg font-extrabold tracking-tight text-white">Observa</p><p class="text-xs font-medium text-slate-500">RADAR ÓDIO</p></div>
      </div>

      <nav class="mt-10 space-y-1" aria-label="Navegação principal">
        <button class="nav-item active" data-route="admin"><span class="nav-icon">⌂</span><span>Visão geral</span></button>
        <button class="nav-item" data-route="avaliar"><span class="nav-icon">✓</span><span>Avaliar</span></button>
        <button class="nav-item" data-route="reconciliar"><span class="nav-icon">⇄</span><span>Reconciliação</span><span id="conflict-badge" class="ml-auto hidden rounded-full bg-rose-400/15 px-2 py-0.5 text-xs font-bold text-rose-300"></span></button>
        <button class="nav-item" data-route="resultados"><span class="nav-icon">↓</span><span>Resultados</span></button>
      </nav>

      <div class="mt-auto rounded-2xl border border-white/10 bg-white/[.04] p-4">
        <p class="text-xs font-bold uppercase tracking-[.16em] text-slate-500">Banco centralizado</p>
        <p class="mt-2 text-xs leading-5 text-slate-400">Avaliações feitas em dispositivos da mesma rede são salvas no SQLite deste servidor.</p>
        <span id="server-status" class="mt-3 inline-flex items-center gap-2 text-xs font-semibold text-mint-400"><span class="h-2 w-2 rounded-full bg-mint-400"></span>Conectado</span>
      </div>
    </aside>

    <div id="sidebar-backdrop" class="fixed inset-0 z-40 hidden bg-black/60 lg:hidden"></div>

    <div class="lg:col-start-2">
      <header class="sticky top-0 z-30 border-b border-slate-200/80 bg-slate-50/85 backdrop-blur-xl dark:border-white/10 dark:bg-ink-950/85">
        <div class="flex h-20 items-center justify-between px-5 sm:px-8 xl:px-10">
          <div class="flex items-center gap-3">
            <button id="menu-button" class="icon-button lg:hidden" aria-label="Abrir menu">☰</button>
            <div><h1 id="page-title" class="text-xl font-extrabold tracking-tight">Visão geral</h1><p id="page-subtitle" class="hidden text-sm text-slate-500 sm:block">Acompanhe lotes e equipe em um só lugar</p></div>
          </div>
          <div class="flex items-center gap-2">
            <button id="theme-toggle" class="icon-button" aria-label="Alternar tema"><span id="theme-icon">☼</span></button>
            <button id="profile-button" class="flex items-center gap-3 rounded-2xl border border-slate-200 bg-white px-3 py-2 shadow-sm transition hover:border-teal-400 dark:border-white/10 dark:bg-white/[.04]" aria-label="Sair da conta">
              <span id="profile-avatar" class="grid h-9 w-9 place-items-center rounded-xl bg-teal-400/15 text-sm font-extrabold text-teal-500">AD</span>
              <span class="hidden text-left sm:block"><span id="profile-name" class="block text-sm font-bold"></span><span id="profile-role" class="block text-[11px] text-slate-500">Sair da conta</span></span>
            </button>
          </div>
        </div>
      </header>

      <main class="mx-auto max-w-[1500px] px-5 py-7 sm:px-8 xl:px-10">
        <section id="view-admin" data-view></section>
        <section id="view-avaliar" data-view class="hidden"></section>
        <section id="view-reconciliar" data-view class="hidden"></section>
        <section id="view-resultados" data-view class="hidden"></section>
      </main>
    </div>
  </div>

  <div id="modal-root"></div>
  <div id="toast-root" class="fixed bottom-5 right-5 z-[110] flex w-[min(92vw,390px)] flex-col gap-3" aria-live="polite"></div>
  <script type="module" src="/js/app.js"></script>
</body>
</html>
